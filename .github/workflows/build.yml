
name: Build Fawry Machine Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Extract source
        run: |
          mkdir project
          unzip -q ./*.zip -d project

      - name: Build mod
        run: gradle -p project build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FawryMachine-1.12.2
          path: project/build/libs/*.jar
          
